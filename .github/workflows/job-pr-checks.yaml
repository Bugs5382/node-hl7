name: PR Checks
# Authoritative CI enforcement of what the local hooks check (hooks are advisory
# and may not be installed): conventional PR title, no AI-tells/emoji in the
# diff, a PR body that follows the template + references an issue, and the
# gitleaks secret scan.
#
# ONE job, with each check as a step. Each of these checks does a few seconds of
# work, and GitHub bills every job for at least a full minute, so four separate
# jobs cost four minutes per run where one job costs one. Every check step runs
# with `!cancelled()`, so a failing check never hides the ones after it: the log
# shows every failure, and the job fails if any step failed.
#
# Draft PRs are skipped; the run happens when the PR is marked ready. This is
# the only workflow (with the label checker, which also reads the title) that
# reacts to `edited`, so a title or body fix reruns one job, not the build. An
# edit reruns every step, not just title and body: the new result replaces the
# last one for the same commit, so skipping hygiene or gitleaks on an edit would
# turn an earlier failure green.
on:
  pull_request:
    types: [opened, edited, synchronize, reopened, ready_for_review]
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  checks:
    name: ✅ PR Checks
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: 📝 PR Title
        uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: 📋 PR Body
        if: ${{ !cancelled() }}
        env:
          BODY: ${{ github.event.pull_request.body }}
        # An issue reference is a keyword (GitHub's closing keywords, or Refs),
        # an optional colon, then a reference GitHub links: #12, GH-12,
        # owner/repo#12, or https://github.com/owner/repo/issues/12. Casing is
        # free. A repo without its owner (repo#12) or a fragment on another
        # site does not count, because GitHub does not link those.
        run: |
          fail=0
          owner='[[:alnum:]][[:alnum:]-]*'
          repo='[[:alnum:]._-]+'
          target="(#|gh-|${owner}/${repo}#|https://github\\.com/${owner}/${repo}/issues/)[0-9]+"
          ref="(^|[^[:alnum:]_])(close[sd]?|fix(e[sd])?|resolve[sd]?|refs):?[[:space:]]+${target}([^[:alnum:]_]|\$)"
          printf '%s' "$BODY" | grep -qiE "$ref" \
            || { echo "PR body must reference an issue (e.g. 'Closes #12' or 'Refs owner/repo#12')."; fail=1; }
          printf '%s' "$BODY" | grep -qiE '##[[:space:]]*what' \
            || { echo "PR body must follow the template (a 'What and why' section)."; fail=1; }
          [ "$fail" -eq 0 ] || exit 1

      - name: Checkout
        id: checkout
        if: ${{ !cancelled() }}
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: 🧼 PR Hygiene
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Reuse the exact rules the local pre-commit hook uses.
          source .claude/hooks/lib.sh
          fail=0
          while IFS= read -r f; do
            [ -f "$f" ] || continue
            case "$f" in
              .git/*) continue ;;
              *.png|*.jpg|*.jpeg|*.gif|*.pdf|*.ico|*.svg|*.woff|*.woff2|*.ttf|*.eot|*.zip|*.gz) continue ;;
            esac
            # Emoji allowed in Markdown and .github; blocked elsewhere.
            case "$f" in
              .github/*|*.md|NOTES.txt|*/NOTES.txt) : ;;
              *) e="$(gov_find_emoji < "$f")"; [ -n "$e" ] && { echo "emoji not allowed in $f:"; echo "$e"; fail=1; } ;;
            esac
            # AI-tells blocked except in files that document the rule.
            case "$f" in
              CLAUDE.md|*/CLAUDE.md|.claude/*|*/.claude/*|.github/workflows/*|*forbidden-text.txt) : ;;
              *) t="$(gov_find_file_tells "$f")"; [ -n "$t" ] && { echo "AI-tell not allowed in $f:"; echo "$t"; fail=1; } ;;
            esac
          done < <(git diff --name-only --diff-filter=ACM "$BASE" "$HEAD")
          [ "$fail" -eq 0 ] || { echo "pr-hygiene: remove the above before merging."; exit 1; }

      # Secret scan, no paths-ignore: a secret can land in any file, docs
      # included. Hard failure: the scan exits non-zero on a finding. It runs the
      # gitleaks CLI directly rather than gitleaks/gitleaks-action@v2, which needs
      # a paid GITLEAKS_LICENSE for organization-owned repos; the CLI is free
      # everywhere and matches the `gitleaks detect` repos run locally.
      # Installed under $RUNNER_TEMP, not /usr/local/bin, so the step needs
      # no write access outside the job's own temp folder. The tarball is
      # also checked against the release's published SHA-256, the same
      # pattern job-go-security.yaml uses for gosec.
      - name: Install gitleaks
        id: gitleaks-install
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        env:
          VERSION: 8.30.0
          # SHA-256 of gitleaks_<version>_linux_x64.tar.gz, from the release's
          # gitleaks_<version>_checksums.txt. Update it together with VERSION.
          SHA256: 79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/gitleaks/bin"
          mkdir -p "$bin"
          tarball="$RUNNER_TEMP/gitleaks_${VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  $tarball" | sha256sum -c -
          tar -xzf "$tarball" -C "$bin" gitleaks
          echo "$bin" >> "$GITHUB_PATH"
          "$bin/gitleaks" version

      # Scans the commits this PR adds (base..head), not the whole history. The
      # history holds test TLS fixture keys (packages/*/certs, removed from the
      # tree since) that a whole-history scan would flag on every PR.
      - name: 🔒 Gitleaks (secret scan)
        if: ${{ !cancelled() && steps.gitleaks-install.outcome == 'success' }}
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          # Honor a repo-local .gitleaks.toml if present.
          # An array keeps the optional flag pair intact without word splitting.
          args=(detect --source . --log-opts="${BASE}..${HEAD}" --redact --verbose --no-banner)
          if [ -f .gitleaks.toml ]; then args+=(--config .gitleaks.toml); fi
          gitleaks "${args[@]}"
